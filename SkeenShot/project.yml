name: SkeenShot
options:
  bundleIdPrefix: com.edmundskeen
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  SkeenShot:
    type: application
    platform: macOS
    sources:
      - path: SkeenShot
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.edmundskeen.skeenshot
      INFOPLIST_FILE: SkeenShot/Info.plist
      CODE_SIGN_ENTITLEMENTS: SkeenShot/SkeenShot.entitlements
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - target: SkeenShotShare
        embed: true
  SkeenShotShare:
    type: app-extension
    platform: macOS
    sources:
      - path: SkeenShotShare
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.edmundskeen.skeenshot.share
      INFOPLIST_FILE: SkeenShotShare/Info.plist
      CODE_SIGN_ENTITLEMENTS: SkeenShotShare/SkeenShotShare.entitlements
      SKIP_INSTALL: YES
schemes:
  SkeenShot:
    build:
      targets:
        SkeenShot: all
    run:
      config: Debug